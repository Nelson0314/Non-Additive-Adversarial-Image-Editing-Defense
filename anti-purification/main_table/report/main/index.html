<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主表對照</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f2f4f7; --surface:#ffffff; --sunk:#e7eaef;
  --ink:#0f151c; --body:#2b3542; --muted:#5d6b7b; --line:#ccd4de;
  --signal:#10559b; --signal-soft:#dce8f6; --fail:#9f2620;
  --bar:#9fb0c2; --bar-soft:#e7eaef;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1218; --surface:#151d26; --sunk:#0a0f14;
    --ink:#e8eef5; --body:#c2ccd8; --muted:#8695a6; --line:#26313d;
    --signal:#5aa2ef; --signal-soft:#132a41; --fail:#e8756c;
    --bar:#3c4a5a; --bar-soft:#1a232c;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1218; --surface:#151d26; --sunk:#0a0f14;
  --ink:#e8eef5; --body:#c2ccd8; --muted:#8695a6; --line:#26313d;
  --signal:#5aa2ef; --signal-soft:#132a41; --fail:#e8756c;
  --bar:#3c4a5a; --bar-soft:#1a232c;
}
*{box-sizing:border-box}
body{background:var(--paper); color:var(--body); margin:0; padding:20px 16px 64px;
     font-family:var(--sans); font-size:14px; -webkit-font-smoothing:antialiased}
h2{font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.08em;
   text-transform:uppercase; color:var(--muted); margin:30px 2px 8px}
.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:3px;
        background:var(--surface); margin-bottom:12px}
table{border-collapse:collapse; font-family:var(--mono); font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line); padding:6px 9px; text-align:right; white-space:nowrap}
thead th{position:sticky; top:0; z-index:2; background:var(--sunk); color:var(--ink);
         font-family:var(--sans); font-size:11.5px; font-weight:600;
         letter-spacing:.05em; text-align:right; border-bottom:1px solid var(--line)}
tbody th{text-align:left; font-family:var(--sans); font-weight:500; color:var(--ink)}
td.b{font-weight:600; color:var(--signal)}
tr.ours th, tr.ours td{background:var(--signal-soft)}
.dir{color:var(--muted); font-weight:400}
.x{display:block; font-size:11px; font-weight:600; color:var(--fail);
   font-variant-numeric:tabular-nums; margin-top:1px}
td.hot{color:var(--fail); font-weight:600}

#grid, #dgrid{border-collapse:separate; border-spacing:0}
#grid th.mh, #dgrid th.mh{position:sticky; top:0; z-index:3; background:var(--sunk); color:var(--ink);
            font-family:var(--sans); font-size:11.5px; font-weight:600; letter-spacing:.04em;
            text-align:center; padding:7px 4px; border-bottom:1px solid var(--line)}
#grid th.mh.ours, #dgrid th.mh.ours{background:var(--signal-soft); color:var(--signal)}
#grid th.rh, #dgrid th.rh{position:sticky; left:0; z-index:2; background:var(--surface);
            border-right:1px solid var(--line); padding:6px 8px; text-align:left;
            vertical-align:top}
#grid th.rh.corner, #dgrid th.rh.corner{z-index:4; top:0; background:var(--sunk)}
#grid td, #dgrid td{padding:2px; border-bottom:0; text-align:center;
                    width:108px; min-width:108px}
#grid img.cell, #dgrid img.cell{width:104px; min-width:104px; height:104px;
  min-height:104px; object-fit:contain; display:block; border-radius:2px;
  background:var(--sunk)}
#dgrid .lp{font-family:var(--mono); font-size:11px; color:var(--ink);
           padding:2px 0 0; font-variant-numeric:tabular-nums}
#dgrid .vm{display:block; font-family:var(--mono); font-size:10px; color:var(--muted);
           padding:0 0 5px}
.rl{display:flex; gap:6px; align-items:flex-start}
.rl img{width:46px; height:46px; border-radius:2px; display:block; border:1px solid var(--line)}
.rl .t{font-family:var(--sans); font-size:11px; line-height:1.45; color:var(--body);
       max-width:150px; white-space:normal}
.rl .t b{color:var(--ink); font-weight:600; display:block; font-family:var(--mono); font-size:11px}

/* charts */
.chartwrap{display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
           gap:16px; margin-bottom:12px}
svg.bars{width:100%; height:auto; font-family:var(--mono)}
svg.bars text{fill:var(--body)}
svg.bars .lbl{font-family:var(--sans); font-size:10.5px; fill:var(--ink); text-anchor:end}
svg.bars .val{font-size:10.5px; font-variant-numeric:tabular-nums}
svg.bars .grid{stroke:var(--line); stroke-width:1}
svg.bars rect.bar{fill:var(--bar)}
svg.bars rect.bar.ours{fill:var(--signal)}
svg.bars .title{font-family:var(--sans); font-size:11.5px; font-weight:600;
                letter-spacing:.04em; text-transform:uppercase; fill:var(--muted)}

/* aesthetics section */
.ae-block{margin-bottom:22px}
.ae-row{display:flex; gap:2px; overflow-x:auto; padding:4px 0 10px;
        border-bottom:1px solid var(--line); align-items:flex-start}
.ae-cell{flex:0 0 auto; width:96px; text-align:center}
.ae-cell img{width:92px; height:92px; object-fit:contain; border-radius:2px;
             background:var(--sunk); display:block; margin:0 auto}
.ae-cell .nm{font-family:var(--sans); font-size:10px; color:var(--body); margin-top:3px;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ae-cell .nm.orig{color:var(--muted); font-style:italic}
.ae-cell .nm.ours{color:var(--signal); font-weight:600}
.ae-cell .vv{font-family:var(--mono); font-size:10.5px; color:var(--ink);
             font-variant-numeric:tabular-nums}
.ae-imglabel{font-family:var(--sans); font-size:11px; font-weight:600; color:var(--ink);
             width:64px; flex:0 0 auto; padding-top:36px}
</style>

<h2>defence images · fid LPIPS / VMAF</h2>
<div class="scroll"><table id="dgrid"></table></div>

<h2>edit outputs</h2>
<div class="scroll"><table id="grid"></table></div>

<h2>VMAF by condition</h2>
<div class="chartwrap">
  <svg class="bars" id="chart-disp-vmaf" viewBox="0 0 480 300"></svg>
  <svg class="bars" id="chart-fid-vmaf" viewBox="0 0 480 300"></svg>
</div>

<h2>fidelity(defence image vs original)</h2>
<div class="scroll"><table id="t1"></table></div>

<h2>displacement(edit(original) vs edit(defended))</h2>
<div class="scroll"><table id="t2"></table></div>

<h2>retention(after purification)</h2>
<div class="scroll"><table id="t3"></table></div>

<h2 id="ae-heading">aesthetic metrics · real images</h2>
<div id="aesthetics"></div>

<h2>FLUX.1-Kontext · guidance 3.5, 1024×1024, no strength(協定與 ip2p/inpaint 不同，不可直接比較)</h2>
<div class="chartwrap">
  <svg class="bars" id="chart-flux-id" viewBox="0 0 480 300"></svg>
  <svg class="bars" id="chart-flux-lpips" viewBox="0 0 480 300"></svg>
</div>
<div class="scroll"><table id="tflux"></table></div>
<div class="scroll"><table id="fluxgrid"></table></div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.MAIN;
  var COLS = ['undefended'].concat(D.order);
  var byName = {}; D.methods.forEach(function(m){ byName[m.name] = m; });

  function f(x, dp){
    if (x === null || x === undefined || isNaN(x)) return '—';
    return Number(x).toFixed(dp);
  }

  /* 防禦圖矩陣 */
  var dhead = '<thead><tr><th class="rh corner"></th>' + D.order.map(function(c){
    return '<th class="mh' + (c === 'colour_curve_ours' ? ' ours' : '') + '">' + c + '</th>';
  }).join('') + '</tr></thead>';
  var dbody = '<tbody>' + D.names.map(function(nm){
    var rh = '<th class="rh"><div class="rl">' +
      '<img src="img/orig_' + nm + '.webp" alt="">' +
      '<span class="t"><b>' + nm + '</b></span></div></th>';
    return '<tr>' + rh + D.order.map(function(c){
      var lp = (byName[c].fid_by_image || {})[nm];
      var vm = byName[c].fid_vmaf;
      return '<td><img class="cell" loading="lazy" src="img/def_' + c + '_' + nm +
        '.webp" alt=""><div class="lp">LPIPS ' + f(lp, 4) + '</div>' +
        '<div class="vm">VMAF ' + f(vm, 1) + '</div></td>';
    }).join('') + '</tr>';
  }).join('') + '</tbody>';
  document.getElementById('dgrid').innerHTML = dhead + dbody;

  /* 編輯矩陣 */
  var head = '<thead><tr><th class="rh corner"></th>' + COLS.map(function(c){
    return '<th class="mh' + (c === 'colour_curve_ours' ? ' ours' : '') + '">' + c + '</th>';
  }).join('') + '</tr></thead>';
  var body = '<tbody>' + D.cells.map(function(cell){
    var tag = cell.scenario + cell.pi;
    var thumbs = '<img src="img/orig_' + cell.image + '.webp" alt="">';
    if (cell.scenario === 'inpaint')
      thumbs += '<img src="img/mask_' + cell.image + '.webp" alt="">';
    var rh = '<th class="rh"><div class="rl">' + thumbs +
      '<span class="t"><b>' + cell.image + '</b>' + cell.prompt + '</span></div></th>';
    return '<tr>' + rh + COLS.map(function(c){
      return '<td><img class="cell" loading="lazy" src="img/e_' + tag + '_' + c + '_' +
        cell.image + '.webp" alt=""></td>';
    }).join('') + '</tr>';
  }).join('') + '</tbody>';
  document.getElementById('grid').innerHTML = head + body;

  /* 表 */
  function metricTable(id, cols, order, byNameArg) {
    order = order || D.order; byNameArg = byNameArg || byName;
    var ms = order.map(function(n){ return byNameArg[n]; });
    var best = {};
    cols.forEach(function(c){
      if (!c.dir) return;
      var vals = ms.map(function(m){ return m[c.key]; })
                   .filter(function(v){ return v !== null && v !== undefined; });
      if (!vals.length) return;
      best[c.key] = c.dir === 'up' ? Math.max.apply(null, vals) : Math.min.apply(null, vals);
    });
    var arrow = {up:'↑', down:'↓'};
    var h = '<thead><tr><th>condition</th>' + cols.map(function(c){
      return '<th>' + c.label + ' <span class="dir">' + (arrow[c.dir] || '') + '</span></th>';
    }).join('') + '</tr></thead>';
    var b = '<tbody>' + ms.map(function(m){
      return '<tr' + (m.name === 'colour_curve_ours' ? ' class="ours"' : '') + '>' +
        '<th>' + m.name + '</th>' + cols.map(function(c){
          var v = m[c.key];
          var isBest = (v !== null && v !== undefined && best[c.key] !== undefined &&
                        Math.abs(v - best[c.key]) < 1e-9);
          var mark = '', hot = false;
          var med = c.ref ? D.median[c.key] : null;
          if (med !== null && med !== undefined && v !== null && v !== undefined && med !== 0) {
            if (c.ref === 'db') {
              var d = v - med;
              if (Math.abs(d) >= 6) { hot = true; mark = (d >= 0 ? '+' : '') + d.toFixed(1) + ' dB'; }
            } else {
              var r = v / med;
              if (r >= 2 || r <= 0.5) { hot = true; mark = '×' + (r >= 1 ? r.toFixed(1) : r.toFixed(2)); }
            }
          }
          var cls = isBest ? ' class="b"' : (hot ? ' class="hot"' : '');
          return '<td' + cls + '>' + f(v, c.dp) +
            (mark ? '<span class="x">' + mark + '</span>' : '') + '</td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody>';
    document.getElementById(id).innerHTML = h + b;
  }

  metricTable('t1', [
    {key:'fid_lpips',     label:'LPIPS',    dir:'down', dp:4, ref:'x'},
    {key:'fid_psnr',      label:'PSNR',     dir:'up',   dp:2, ref:'db'},
    {key:'fid_rms',       label:'rms',      dir:'down', dp:5, ref:'x'},
    {key:'fid_linf',      label:'L inf',    dir:'down', dp:4, ref:'x'},
    {key:'fid_ssim',      label:'SSIM',     dir:'up',   dp:4, ref:'x'},
    {key:'fid_vif_p',     label:'VIFp',     dir:'up',   dp:4, ref:'x'},
    {key:'fid_dists',     label:'DISTS',    dir:'down', dp:4, ref:'x'},
    {key:'fid_fsim',      label:'FSIM',     dir:'up',   dp:4, ref:'x'},
    {key:'fid_delta_e00', label:'ΔE00',     dir:'down', dp:3, ref:'x'},
    {key:'fid_vmaf',      label:'VMAF',     dir:'up',   dp:2, ref:'x'}
  ]);

  metricTable('t2', D.metrics.map(function(m){
    return {key:m.key, label:m.label, dir:m.dir, dp:m.dp, ref:'x'};
  }));

  D.methods.forEach(function(m){
    D.purifiers.forEach(function(p){
      m['__ret_' + p] = (m.ret_p || {})[p];
      m['__retvmaf_' + p] = (m.ret_vmaf_p || {})[p];
    });
  });
  metricTable('t3', [
    {key:'ret',      label:'retained',      dir:'up', dp:4},
    {key:'ret_fsim', label:'retained FSIM', dir:'up', dp:4},
    {key:'ret_vmaf', label:'retained VMAF', dir:'up', dp:2},
    {key:'blocked',  label:'blocked',       dir:'up', dp:0}
  ].concat(D.purifiers.map(function(p){
    return {key:'__ret_' + p, label:p, dir:'up', dp:4};
  })));

  /* 圖表:水平長條,依 order 排序,colour_curve_ours 標色 */
  function barChart(svgId, title, key, dp, unit, order, byNameArg) {
    order = order || D.order; byNameArg = byNameArg || byName;
    var svg = document.getElementById(svgId);
    var W = 480, H = 300, padL = 132, padR = 46, padT = 26, padB = 10;
    var rows = order.map(function(n){ return byNameArg[n]; });
    var vals = rows.map(function(m){ return m[key]; }).filter(function(v){ return v !== null; });
    var vmax = Math.max.apply(null, vals) * 1.08;
    var rh = (H - padT - padB) / rows.length;
    var innerW = W - padL - padR;
    var parts = ['<text class="title" x="' + padL + '" y="14">' + title + '</text>'];
    /* 網格：0、中點、最大 */
    [0, 0.5, 1].forEach(function(t){
      var x = padL + innerW * t;
      parts.push('<line class="grid" x1="' + x + '" y1="' + padT + '" x2="' + x +
        '" y2="' + (H - padB) + '"></line>');
    });
    rows.forEach(function(m, i){
      var y = padT + i * rh;
      var v = m[key];
      var w = (v === null || v === undefined) ? 0 : (v / vmax) * innerW;
      var barY = y + rh * 0.22, barH = rh * 0.56;
      var isOurs = m.name === 'colour_curve_ours';
      parts.push('<text class="lbl" x="' + (padL - 8) + '" y="' + (y + rh * 0.64) + '">' +
        m.name + '</text>');
      parts.push('<rect class="bar' + (isOurs ? ' ours' : '') + '" x="' + padL + '" y="' + barY +
        '" width="' + w + '" height="' + barH + '" rx="2"></rect>');
      parts.push('<text class="val" x="' + (padL + w + 6) + '" y="' + (y + rh * 0.64) + '">' +
        (v === null || v === undefined ? '—' : v.toFixed(dp) + (unit || '')) + '</text>');
    });
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.innerHTML = parts.join('');
  }
  barChart('chart-disp-vmaf', 'displacement VMAF(edit(orig) vs edit(defended))', 'disp_vmaf', 1);
  barChart('chart-fid-vmaf', 'defence VMAF(defence image vs original)', 'fid_vmaf', 1);

  /* 美術指標:真圖逐條件排序 */
  var A = D.aesthetics;
  var aeHtml = '';
  A.metrics.forEach(function(metric){
    aeHtml += '<div class="ae-block"><h2>' + metric.label +
      ' <span class="dir">(' + (metric.dir === 'up' ? '↑ 由高到低' : '↓ 由低到高') + ')</span></h2>';
    A.images.forEach(function(name){
      var entries = A.rows[name][metric.key];
      var row = '<div class="ae-row"><div class="ae-imglabel">' + name + '</div>';
      entries.forEach(function(e){
        var isOrig = e.condition === 'original';
        var isOurs = e.condition === 'colour_curve_ours';
        var src = isOrig ? 'img/orig_' + name + '.webp'
                          : 'img/def_' + e.condition + '_' + name + '.webp';
        row += '<div class="ae-cell"><img src="' + src + '" loading="lazy" alt="">' +
          '<div class="vv">' + e.value.toFixed(3) + '</div>' +
          '<div class="nm' + (isOrig ? ' orig' : '') + (isOurs ? ' ours' : '') + '">' +
          (isOrig ? 'original' : e.condition) + '</div></div>';
      });
      row += '</div>';
      aeHtml += row;
    });
    aeHtml += '</div>';
  });
  document.getElementById('aesthetics').innerHTML = aeHtml;

  /* FLUX 全表 */
  var F = D.flux;
  var byNameFlux = {}; F.methods.forEach(function(m){ byNameFlux[m.name] = m; });

  barChart('chart-flux-id', 'id_orig(FaceNet, edit(defended) vs 原圖)', 'id_orig', 3,
          '', F.order, byNameFlux);
  barChart('chart-flux-lpips', 'displacement LPIPS(edit(undefended) vs edit(defended))',
          'disp_lpips_full', 3, '', F.order, byNameFlux);

  metricTable('tflux', F.metrics.map(function(m){
    return {key:m.key, label:m.label, dir:m.dir, dp:m.dp, ref:'x'};
  }).concat([{key:'id_orig', label:'id_orig', dir:'up', dp:3, ref:'x'}]),
    F.order, byNameFlux);

  var fluxCols = ['undefended'].concat(F.order);
  var fhead = '<thead><tr><th class="rh corner"></th>' + fluxCols.map(function(c){
    return '<th class="mh' + (c === 'colour_curve_ours' ? ' ours' : '') + '">' + c + '</th>';
  }).join('') + '</tr></thead>';
  var fbody = '<tbody>' + D.names.map(function(nm){
    var rh = '<th class="rh"><div class="rl">' +
      '<img src="img/orig_' + nm + '.webp" alt="">' +
      '<span class="t"><b>' + nm + '</b></span></div></th>';
    return '<tr>' + rh + fluxCols.map(function(c){
      return '<td><img class="cell" loading="lazy" src="img/flux_' + c + '_' + nm +
        '_p0.webp" alt=""></td>';
    }).join('') + '</tr>';
  }).join('') + '</tbody>';
  document.getElementById('fluxgrid').innerHTML = fhead + fbody;
})();
</script>
</html>
