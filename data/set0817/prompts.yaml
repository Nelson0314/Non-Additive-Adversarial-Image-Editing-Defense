# 2026-08-17 的新資料集。使用者當日提供九張影像，先前的實驗結果全數作廢。
#
# prompts[0] 是本輪實際使用的那一句，逐張由編輯成功掃描（runs/editsweep）
# 挑出來：SDEdit strength 0.8 / guidance 7.5 下人眼判定有服從 prompt 的那一句。
# 使用者裁定「能成功的就用原本的」，故 cat 與 shiba 維持戴帽，其餘七張改用
# 換場景——換衣物那組的顏色即使開到 0.9 也被忽略，鸚鵡與浣熊戴不上帽子。
# prompts[1] 是被換掉的那一句，留著備查。
#
# 2026-08-17 二次修訂（使用者裁定）：
#
#   1. **不做遮罩了。** strength 0.8 會把臉整個換掉，原本的作法是加頭部遮罩讓
#      臉在 latent 混合中被保留；改為在 prompt 裡直接寫出本人姓名，讓模型自己
#      把臉生成回同一個人。`data/set0817/headmasks/` 因此移除，`load_dataset`
#      找不到遮罩就不做混合，威脅模型回到單純的 img2img。
#   2. shiba 由戴帽改為換類別（狗 -> 貓），raccoon 由換場景改為換類別
#      （浣熊 -> 熊貓）。cat 戴帽已確認成功，維持不動；parrot 未指定，維持。
#
# 姓名與換類別都改動了 prompt，**必須重新確認未防禦的編輯有成功**（DEC-022）：
# 人物那五句要確認臉還是同一個人且背景真的換掉，shiba／raccoon 要確認真的變成
# 貓與熊貓。

cat:
  content: "cat"
  # 戴帽（0.8 下成功）
  prompts:
    - "a cat wearing a red party hat"
    - "a cat sitting on a snowy roof"

shiba:
  content: "dog"
  # 換類別（2026-08-17 使用者指定：柴犬變貓）
  prompts:
    - "a cat"
    - "a dog wearing a yellow knitted hat"

parrot:
  content: "parrot"
  # 換場景（戴帽 0.9 仍失敗）
  prompts:
    - "a parrot perched on a branch in a rainforest"
    - "a parrot wearing a tiny straw hat"

raccoon:
  content: "raccoon"
  # 換類別（2026-08-17 使用者指定：浣熊變熊貓）
  prompts:
    - "a panda"
    - "a raccoon standing on a city sidewalk at night"

obama:
  content: "man"
  # 換場景，prompt 裡寫出本人姓名（2026-08-17 使用者指定，取代頭部遮罩）
  prompts:
    - "Barack Obama standing on a snowy street"
    - "a man wearing a red hooded sweatshirt"

