# 本地開發環境（conda env `wacv`）。實測版本見 NOTES.md「套件版本」。
# 不釘版本：TWCC 端 torch/CUDA 版本本就不同，程式碼不綁定特定版本。
# TWCC 建env 踩坑（conda tos accept、PIP_USER=0、PYTHONNOUSERSITE=1）見 TWCC_CHECKLIST.md。
name: wacv
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch          # 本地裝 CPU 版；TWCC 用容器預裝或 CUDA 版
      - torchvision
      - diffusers
      - transformers
      - accelerate
      - piq            # 指標，SPEC §2.6 指定，不可替換
      # NIQE 由 pyiqa 提供，而 MetricSuite.full() 對每張圖各算一次 NIQE，
      # 所以這是 run_defense.py 評測路徑（未加 --no_eval 時）的執行期相依，
      # 不只是 tests/test_battery.py 用得到。2026-08-02 之前本檔漏列它：
      # 本機與 TWCC 都是臨時裝的（docs/NIGHT_RUN_2026-07-29.md），
      # 而 scripts/drivers/*_setup.sh 的清單抄自本檔，於是一起漏掉。
      #
      # 雲端機器請以 `--no-deps` 安裝（見 scripts/drivers/colab_setup.sh）：
      # pyiqa 的完整相依樹含 torch、torchvision、datasets、bitsandbytes、
      # facexlib、tensorboard 等三十餘項，會覆蓋掉映像檔既有的 torch。
      # 實測本專案用到的指標（niqe/gmsd/nlpd/lpips/dists/stlpips/ms_ssim/
      # ssim/musiq）只載入 numpy、scipy、opencv、pillow、PyYAML、requests、
      # tqdm、rich、huggingface_hub 與 torch，全部另有來源。
      - pyiqa          # NIQE（src/metrics/suite.py、src/metrics/battery.py）
      - scipy          # pyiqa 以 --no-deps 安裝時要自行補上
      - opencv-contrib-python   # cv2.ximgproc.guidedFilter 所需
      - peft           # APA Stage 1 LoRA（官方實作使用，SPEC §4.4.2）
      - pytest
      - pyyaml
      - psutil         # 記憶體量測（開發輔助）
      - matplotlib     # stage 腳本之校準與淨化強度曲線
      # `MetricSuite.semantic()` 的 SigLIP（google/siglip-base-patch16-224）。
      # 其 tokenizer 是 SentencePiece 型，transformers 載入時要 protobuf 解
      # tokenizer 模型；缺任一者都以 ImportError 失敗。兩項本機都在
      # （protobuf 7.35.1、sentencepiece 0.2.2）但本檔 2026-08-06 之前都沒列，
      # 故在 basic-1 的乾淨 env 上於段 0 的 `calibrate_strength` 才暴露。
      - protobuf
      - sentencepiece
