# SPEC §3.1：採 DAYN 重現用設定，非 PhotoGuard 原設定。
# v2.1（2026-07-23）：依官方 notebook 核對後新增 norm / epsilon_scale / target_latent，
# 三者均為 §8 待確認項（第 6–8 項），於 T2 校準階段以 DAYN Table 1 定奪。
photoguard:
  norm: "linf"              # "linf" | "l2"。官方 demo 預設 l2（eps=16、step=1），DAYN 未指明
  epsilon: 0.06             # DAYN κ=0.06；norm=l2 時官方 demo 用 16.0
  epsilon_scale: "pm1"      # "pm1"（官方 [-1,1] 空間）| "01"（[0,1] 空間，等效強度為 pm1 之兩倍）
  step_size: 0.006          # epsilon / 10；norm=l2 時官方 demo 用 1.0
  n_iter: 100               # DAYN 用 100；PhotoGuard 原文 200、官方 demo 1000
  random_init: true         # 官方 encoder attack：於 ε-ball 內隨機初始化
  step_decay: true          # 官方 encoder attack：線性衰減至 1/100（diffusion attack 為常數）
  target_latent: "zeros"    # encoder attack 目標："zeros"（官方 demo）| "gray"（SPEC 偽碼）
  diffusion_T: 10           # diffusion attack 反傳步數（對齊 DAYN；官方 demo 用 4）
  diffusion_target: "gray"  # diffusion attack 之 x_targ："gray"（= [-1,1] 零張量，官方）| "noise"
  grad_reps: 10             # diffusion attack EOT 梯度平均次數（官方；成本約為 encoder 10 倍）
  projection: "from_original"   # 已確認（L1.3）：官方即為以原圖為中心之標準 PGD 投影
