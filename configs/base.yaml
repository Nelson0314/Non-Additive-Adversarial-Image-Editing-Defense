# 模型、資料、編輯、指標（STRUCTURE.md §3）
# 本地開發時 protect_model / eval_models 可暫換為
# "hf-internal-testing/tiny-stable-diffusion-pipe"（CPU 可跑），
# TWCC 上換回真實模型即可，程式碼不得有硬編碼模型假設。

model:
  protect_model: "CompVis/stable-diffusion-v1-4"   # 生成保護時攻擊之模型
  eval_models:                                      # 評測模型
    - "CompVis/stable-diffusion-v1-4"
    - "stabilityai/stable-diffusion-2-base"

generation:            # SPEC §2.2，取自 PhotoGuard Table 8
  height: 512
  width: 512
  guidance_scale: 7.5
  num_inference_steps: 100
  eta: 1

edit:
  methods: ["sdedit", "inpaint"]
  sdedit_strength: null      # SPEC §2.8 待確認，向作者索取
  n_seeds: 20                # SPEC §2.4
  seed_clip_threshold: null  # seed 判準（CLIP score 門檻）；null = 不篩選。判準待與指導者確認
  inpaint_mask:              # placeholder 遮罩規格（DAYN 資料到手後由 dataset 提供真實遮罩）
    type: "center_square"    # 中央方形，1=重繪
    fraction: 0.5            # 邊長比例（0.5 = 高寬各 1/2，面積 1/4）
                             # 注意：遮罩幾何實質影響保護難度（DiffusionGuard/AdvPaint），
                             # placeholder 遮罩之結果與真實資料集結果不可直接比較

data:
  root: "data/dayn_testset"
  source: "向 DAYN 作者索取"
  is_placeholder: true       # 取得原始資料集後改為 false
  n_images: 150              # SPEC §2.4
  n_object_classes: 3
  prompts_per_class: 2

metrics:
  backend: "piq"             # SPEC §2.6，不可換
  compute: ["psnr", "ssim", "vifp", "fsim", "lpips", "fid", "clip"]
  clip_model: "openai/clip-vit-base-patch32"  # CLIP score 用（SPEC 未指定，標準選擇）

runtime:
  # SPEC §1.4 之 batch_size=1 係為「保護生成」而設（有梯度、計算圖深，V100 32GB 上限）
  protect_batch_size: 1
  # v5：編輯為純推論、無梯度，可批次化（stage2 佔約 93% 成本，此為最大加速槓桿）。
  # 前提：批次中每個樣本各自 generator、各自 seed（已實作並驗證：噪聲協定與
  # batch=1 位元級一致，seed 協定 SPEC §2.3 未被破壞）。
  # 啟用判準（v5）：batch=1 vs batch=4 輸出逐位元相同——實測**未通過**：
  # 批次 kernel 之 float32 數值差 ~5e-6（8-bit 存檔後 ~0.02% 像素差 ±1 LSB），
  # 原理上不可達位元級等價（批次矩陣運算之歸約順序隨 batch 尺寸而異）。
  # 故預設 1（批次化不啟用）；判準是否放寬（噪聲協定位元級一致＋輸出容差
  # ≤1e-4）待指導者裁定後方可改 >1。詳 tests/test_edit_batching.py 與 NOTES.md。
  edit_batch_size: 1
  seed: 42
