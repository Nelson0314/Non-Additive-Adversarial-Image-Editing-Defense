[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immunization-color"
version = "0.1.0"
description = "Color-mapping defense (CIELAB global map) for image immunization"
readme = "README.md"
requires-python = ">=3.10"
# immunization_core 由 vendor/ 快照提供（見 vendor.lock.json），不從套件索引安裝。
dependencies = ["torch>=2.0", "torchvision>=0.15", "numpy>=1.24", "Pillow>=9.0", "PyYAML>=6.0",
                "diffusers>=0.30", "transformers>=4.40", "accelerate>=0.30", "safetensors>=0.4",
                "piq==0.8.0", "scikit-image>=0.19",
                "facenet-pytorch>=2.5", "insightface>=0.7", "onnxruntime>=1.16",
                # SigLIP 的 AutoProcessor 載入 SentencePiece tokenizer（必要指標 siglip_pair）
                "sentencepiece", "protobuf"]

[project.optional-dependencies]
# 不在主表淨化協定內的算子：CLAHE、AdverseCleaner（opencv）與 IMPRESS（lpips）；缺席時明確失敗。
purifiers = ["opencv-contrib-python", "lpips"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src", "vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "vendor"]
