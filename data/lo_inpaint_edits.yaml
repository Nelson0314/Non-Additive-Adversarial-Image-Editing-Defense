# inpainting 威脅模型的編輯規格（2026-08-15 使用者裁定）。
#
# 場景只有一種：**在主體上加東西**。遮罩是主體的一個局部方框，prompt 描述
# 加上配件之後的整體。這與「換掉整個主體」不同——後者那一組已完全移除，
# 理由是它逼模型從零重畫一個物件，難度高且與實際的惡意編輯情境不符。
#
# region 對應 `auto_masks.py` 產出的遮罩檔：
#
#   head    頭部方框，向上延伸留出戴帽子的空間。動物與人皆有
#   torso   軀幹方框（僅 person），用於換衣服
#
# **人物用 torso 而非 head**：這批的人物在畫面中佔比大，臉部方框會涵蓋畫面
# 的一半，重畫區太大則「攻擊有沒有成功」不再能歸因到防禦（DEC-022 的同型
# 問題）。換衣服的區域小得多，且是實際會發生的惡意編輯。
#
# prompt 必須讓未防禦的編輯**明顯成功**，否則抗編輯那一欄的分母不成立。
# 每一條都在開跑前以人眼複驗過（見 runs/ip3/preflight 與 runs/ip3/psweep）。
# 五張全部確認未防禦的重畫明顯成功：貓戴上紅色派對帽、狗戴上墨鏡、
# 馬戴上藍色防蠅罩、男性換成紅色皮衣、女性換成深色外套配黃色內搭。

cat_01:
  region: head
  prompt: "a cat wearing a red party hat"

dog_03:
  region: head
  prompt: "a dog wearing sunglasses"

# 草帽／牛仔帽／派對帽／皇冠／sombrero 五種都試過，模型一概照原樣重畫
# （強度 0.045-0.051，圖上看不出任何物件）。防蠅頭罩是真實的馬具，訓練資料
# 裡常見，一次就成功。**強度數字不能用來判斷成敗**：放寬遮罩配 santa hat 的
# 強度 0.0954 卻什麼都沒加，這一條 0.0569 卻明顯戴上。
horse_03:
  region: head
  prompt: "a horse wearing a blue fly mask"

man_02:
  region: torso
  prompt: "a man wearing a red leather jacket"

woman_02:
  region: torso
  prompt: "a woman wearing a yellow raincoat"
