# 受保護主體的矩形框，正規化座標 `[x0, y0, x1, y1]`（0–1，左上為原點）。
#
# **這是發布者標出來的，不是量出來的。** 威脅模型的前提是防護對象已知；
# 本檔用矩形代替那個標注動作。`scripts/decoy_masked.py` 用它把誘餌合成回
# 框外，框內逐位元保留原圖（每一列都驗一次，不是只驗一次）。
#
# `area` 是框佔畫面的比例，只作註記，程式由 `box` 自己算。
# 它決定誘餌還有多少地方可以落腳——**這一族需要畫面上有主體以外的空間**。

task_attr_mod_color_11699:
  # 盆栽人：受保護的是**盆栽**（攻擊指令的目標，也是 decoy_catalogue 的
  # `objects` 登記的主體）。框含枝葉與花盆，不含右側的人與右緣的棕櫚。
  box: [0.167, 0.117, 0.717, 0.983]
  area: 0.48
  note: 框外留下左側牆面、右側人物與棕櫚、以及上緣，誘餌有地方可放。

task_attr_mod_color_6205:
  # 瑪利歐：兩個人偶與工具箱幾乎佔滿畫面。框大到誘餌幾乎無處可放，
  # **這一格預期無效，而那正是要記下來的條件**。
  box: [0.117, 0.067, 0.867, 0.967]
  area: 0.68
  note: 框外只剩四周窄邊，誘餌沒有落腳的空間。
