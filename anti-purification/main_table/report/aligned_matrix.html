<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>對齊臂對照</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f2f4f7; --surface:#ffffff; --sunk:#e7eaef;
  --ink:#0f151c; --body:#2b3542; --muted:#5d6b7b; --line:#ccd4de;
  --signal:#10559b; --signal-soft:#dce8f6; --fail:#9f2620;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1218; --surface:#151d26; --sunk:#0a0f14;
    --ink:#e8eef5; --body:#c2ccd8; --muted:#8695a6; --line:#26313d;
    --signal:#5aa2ef; --signal-soft:#132a41; --fail:#e8756c;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1218; --surface:#151d26; --sunk:#0a0f14;
  --ink:#e8eef5; --body:#c2ccd8; --muted:#8695a6; --line:#26313d;
  --signal:#5aa2ef; --signal-soft:#132a41; --fail:#e8756c;
}
*{box-sizing:border-box}
body{background:var(--paper); color:var(--body); margin:0; padding:20px 16px 64px;
     font-family:var(--sans); font-size:14px; -webkit-font-smoothing:antialiased}
.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:3px;
        background:var(--surface); margin-bottom:34px}
table{border-collapse:collapse; font-family:var(--mono); font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line); padding:6px 9px; text-align:right; white-space:nowrap}
thead th{position:sticky; top:0; z-index:2; background:var(--sunk); color:var(--ink);
         font-family:var(--sans); font-size:11.5px; font-weight:600;
         letter-spacing:.05em; text-align:right; border-bottom:1px solid var(--line)}
tbody th{text-align:left; font-family:var(--sans); font-weight:500; color:var(--ink)}
td.b{font-weight:600; color:var(--signal)}
tr.ours th, tr.ours td{background:var(--signal-soft)}
.dir{color:var(--muted); font-weight:400}
.x{display:block; font-size:11px; font-weight:600; color:var(--fail);
   font-variant-numeric:tabular-nums; margin-top:1px}
td.hot{color:var(--fail); font-weight:600}

#grid{border-collapse:separate; border-spacing:0}
#grid th.mh{position:sticky; top:0; z-index:3; background:var(--sunk); color:var(--ink);
            font-family:var(--sans); font-size:11.5px; font-weight:600; letter-spacing:.04em;
            text-align:center; padding:7px 4px; border-bottom:1px solid var(--line)}
#grid th.mh.ours{background:var(--signal-soft); color:var(--signal)}
#grid th.rh{position:sticky; left:0; z-index:2; background:var(--surface);
            border-right:1px solid var(--line); padding:6px 8px; text-align:left;
            vertical-align:top}
#grid th.rh.corner{z-index:4; top:0; background:var(--sunk)}
#grid td, #dgrid td{padding:2px; border-bottom:0; text-align:center;
                    width:108px; min-width:108px}
#grid img.cell, #dgrid img.cell{width:104px; min-width:104px; height:104px;
  min-height:104px; object-fit:contain; display:block; border-radius:2px;
  background:var(--sunk)}
#dgrid th.mh{position:sticky; top:0; z-index:3; background:var(--sunk); color:var(--ink);
             font-family:var(--sans); font-size:11.5px; font-weight:600; letter-spacing:.04em;
             text-align:center; padding:7px 4px; border-bottom:1px solid var(--line)}
#dgrid th.mh.ours{background:var(--signal-soft); color:var(--signal)}
#dgrid th.rh{position:sticky; left:0; z-index:2; background:var(--surface);
             border-right:1px solid var(--line); padding:6px 8px; text-align:left;
             vertical-align:top}
#dgrid th.rh.corner{z-index:4; top:0; background:var(--sunk)}
#dgrid{border-collapse:separate; border-spacing:0}
#dgrid .lp{font-family:var(--mono); font-size:11.5px; color:var(--ink);
           padding:2px 0 5px; font-variant-numeric:tabular-nums}
#dgrid .de{display:block; font-family:var(--mono); font-size:10.5px; font-weight:400;
           color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums}
#dgrid .de.hotde{color:var(--fail); font-weight:600}
.rl{display:flex; gap:6px; align-items:flex-start}
.rl img{width:46px; height:46px; border-radius:2px; display:block; border:1px solid var(--line)}
.rl .t{font-family:var(--sans); font-size:11px; line-height:1.45; color:var(--body);
       max-width:150px; white-space:normal}
.rl .t b{color:var(--ink); font-weight:600; display:block; font-family:var(--mono); font-size:11px}
</style>

<div class="scroll"><table id="dgrid"></table></div>
<div class="scroll"><table id="grid"></table></div>
<div class="scroll"><table id="t1"></table></div>
<div class="scroll"><table id="t2"></table></div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.MT;
  var COLS = ['undefended'].concat(D.order);
  var byName = {}; D.methods.forEach(function(m){ byName[m.name] = m; });

  function f(x, dp){
    if (x === null || x === undefined || isNaN(x)) return '—';
    return Number(x).toFixed(dp);
  }

  /* 防禦圖矩陣 */
  var dhead = '<thead><tr><th class="rh corner"></th>' + D.order.map(function(c){
    var m = byName[c], de = m.deltae, med = D.median.deltae, mk = '';
    if (de !== null && de !== undefined) {
      var r = de / med;
      mk = '<span class="de' + (r >= 2 || r <= 0.5 ? ' hotde' : '') + '">ΔE00 ' +
        f(de, 2) + (r >= 2 || r <= 0.5 ? ' ×' + r.toFixed(1) : '') + '</span>';
    }
    return '<th class="mh' + (c === 'colour_curve_ours' ? ' ours' : '') + '">' + c + mk + '</th>';
  }).join('') + '</tr></thead>';
  var dbody = '<tbody>' + D.names.map(function(nm){
    var rh = '<th class="rh"><div class="rl">' +
      '<img src="img/orig_' + nm + '.webp" alt="">' +
      '<span class="t"><b>' + nm + '</b></span></div></th>';
    return '<tr>' + rh + D.order.map(function(c){
      var v = (byName[c].fid_by_image || {})[nm];
      return '<td><img class="cell" loading="lazy" src="img/def_' + c + '_' + nm +
        '.webp" alt=""><div class="lp">' + f(v, 4) + '</div></td>';
    }).join('') + '</tr>';
  }).join('') + '</tbody>';
  document.getElementById('dgrid').innerHTML = dhead + dbody;

  /* 影像矩陣 */
  var head = '<thead><tr><th class="rh corner"></th>' + COLS.map(function(c){
    return '<th class="mh' + (c === 'colour_curve_ours' ? ' ours' : '') + '">' + c + '</th>';
  }).join('') + '</tr></thead>';
  var body = '<tbody>' + D.cells.map(function(cell){
    var tag = cell.scenario + cell.pi;
    var thumbs = '<img src="img/orig_' + cell.image + '.webp" alt="">';
    if (cell.scenario === 'inpaint')
      thumbs += '<img src="img/mask_' + cell.image + '.webp" alt="">';
    var rh = '<th class="rh"><div class="rl">' + thumbs +
      '<span class="t"><b>' + cell.image + '</b>' + cell.prompt + '</span></div></th>';
    return '<tr>' + rh + COLS.map(function(c){
      return '<td><img class="cell" loading="lazy" src="img/e_' + tag + '_' + c + '_' +
        cell.image + '.webp" alt=""></td>';
    }).join('') + '</tr>';
  }).join('') + '</tbody>';
  document.getElementById('grid').innerHTML = head + body;

  /* 表：失真與位移 */
  function metricTable(id, cols) {
    var ms = D.order.map(function(n){ return byName[n]; });
    var best = {};
    cols.forEach(function(c){
      if (!c.dir) return;
      var vals = ms.map(function(m){ return m[c.key]; })
                   .filter(function(v){ return v !== null && v !== undefined; });
      if (!vals.length) return;
      best[c.key] = c.dir === 'up' ? Math.max.apply(null, vals) : Math.min.apply(null, vals);
    });
    var arrow = {up:'↑', down:'↓'};
    var h = '<thead><tr><th>method</th>' + cols.map(function(c){
      return '<th>' + c.label + ' <span class="dir">' + (arrow[c.dir] || '') + '</span></th>';
    }).join('') + '</tr></thead>';
    var b = '<tbody>' + ms.map(function(m){
      return '<tr' + (m.name === 'colour_curve_ours' ? ' class="ours"' : '') + '>' +
        '<th>' + m.name + '</th>' + cols.map(function(c){
          var v = m[c.key];
          var isBest = (v !== null && v !== undefined && best[c.key] !== undefined &&
                        Math.abs(v - best[c.key]) < 1e-9);
          var mark = '', hot = false;
          var med = c.ref ? D.median[c.key] : null;
          if (med !== null && med !== undefined && v !== null && v !== undefined) {
            if (c.ref === 'db') {
              var d = v - med;
              if (Math.abs(d) >= 6) { hot = true; mark = (d >= 0 ? '+' : '') + d.toFixed(1) + ' dB'; }
            } else {
              var r = v / med;
              if (r >= 2 || r <= 0.5) { hot = true; mark = '×' + (r >= 1 ? r.toFixed(1) : r.toFixed(2)); }
            }
          }
          var cls = isBest ? ' class="b"' : (hot ? ' class="hot"' : '');
          return '<td' + cls + '>' + f(v, c.dp) +
            (mark ? '<span class="x">' + mark + '</span>' : '') + '</td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody>';
    document.getElementById(id).innerHTML = h + b;
  }

  metricTable('t1', [
    {key:'fid_lpips', label:'defence LPIPS', dir:'down', dp:4, ref:'x'},
    {key:'deltae',    label:'defence ΔE00',  dir:'down', dp:3, ref:'x'},
    {key:'fid_psnr',  label:'defence PSNR',  dir:'up',   dp:2, ref:'db'},
    {key:'fid_rms',   label:'defence rms',   dir:'down', dp:5, ref:'x'},
    {key:'fid_linf',  label:'defence L inf', dir:'down', dp:4, ref:'x'},
    {key:'scale',     label:'eps scale',     dir:'',     dp:3}
  ].concat(D.metrics.map(function(m){
    return {key:m.key, label:m.label, dir:m.dir, dp:m.dp};
  })));

  /* 保留率逐算子要攤平成頂層欄才排得出最佳 */
  D.methods.forEach(function(m){
    D.purifiers.forEach(function(p){ m['__ret_' + p] = (m.ret_p || {})[p]; });
  });
  metricTable('t2', [
    {key:'ret', label:'retained', dir:'up', dp:4},
    {key:'blocked', label:'blocked', dir:'up', dp:0}
  ].concat(D.purifiers.map(function(p){
    return {key:'__ret_' + p, label:p, dir:'up', dp:4};
  })));
})();
</script>
</html>
