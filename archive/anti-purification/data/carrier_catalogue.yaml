# 衣物載體那一族的受保護主體登記。
#
# 為什麼與 `decoy_catalogue.yaml` 分開
# ────────────────────────────────────────────────────────────────────
# 誘餌族登記的是「畫面裡值得保護的東西」，含人本身（盆栽人那張登記的是
# `[potted plant, person]`）。衣物載體族**結構上要求受保護主體與穿衣服的人
# 是分開的兩個東西**——人被登記成主體時，衣服全部落在受保護核心內，合法
# 載體是 0。兩份登記回答不同的問題，合成一份會讓其中一族靜默地沒有載體。
#
# 挑選與登記的依據
# ────────────────────────────────────────────────────────────────────
# 主體名詞是**看圖登記的顯著非人物件**，不是從攻擊指令推導的——威脅模型的
# 前提是防護對象已知，攻擊指令不是。
#
# 候選由 ATR 人體解析篩出（`face >= 0.01` 且 `clothes >= 0.10`，147 張裡 42
# 張），再逐張看圖挑出「有一個與人分開的物件」的那些。逐張量到的合法載體
# 面積（衣物 ∩ 主體補集）記在下面，供派工前核對。
#
# 兩張登記了但不進批次的，理由一併留著：
#   task_attr_mod_color_184837  picture frame → CLIPSeg 遮罩面積 0.999
#                               （畫框環繞整張圖，整張都被判成主體）
#   task_attr_mod_color_41275   backpack     → 合法載體只有 0.0096

