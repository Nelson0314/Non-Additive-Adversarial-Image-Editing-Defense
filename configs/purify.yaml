# SPEC §5。DiffPure 已移出獨立條件，其機制存在於 GrIDPure 內部
jpeg:
  quality: [90, 80, 65, 50]    # 65 為社群標準設定

blur:
  sigma: [0.5, 1.0, 1.5]

crop_resize:
  ratio: [0.1, 0.2, 0.3]       # 0.2 為標準設定

adverse_cleaner:               # 即 BF+GF，兩變體
  variants: ["bf_only", "bf_gf"]
  # preflight 論文核驗修正：官方 clean.py 為 64×BF + 4×GF（SPEC 原記 3×BF+1×GF 有誤）
  bf_iterations: 64
  bf_d: 5
  bf_sigma_color: 8
  bf_sigma_space: 8
  gf_iterations: 4
  gf_radius: 4
  gf_eps: 16

gridpure:                      # SPEC §5.3；timestep 尺度 = 1000 步 DDPM 之原始步數（L1.3 確認）
  grid_size: 256
  stride: 128
  n_grids: 10                  # 九個 + 四角落組成的第十個
  gamma: 0.1
  # v5（SPEC §5.3）：三個來源給出三組預設，以論文的 10×10 為主要設定，
  # 另兩組作為強度掃描端點：
  # - paper：論文預設 10×10（多次淺淨化，主要設定）
  # - readme：官方 README 10×20（多次淺淨化、迭代較多之端點）
  # - single_deep：官方腳本 100×1（單次深淨化，行為上退化為 DiffPure）
  # paper/readme vs single_deep 之對照可檢驗迭代設計是否確實優於單次深淨化
  settings:
    - name: "paper"
      pure_steps: 10
      iterations: 10
    - name: "readme"
      pure_steps: 10
      iterations: 20
    - name: "single_deep"
      pure_steps: 100
      iterations: 1
  pure_steps_scan: [5, 15]     # paper 模式（iterations=10）之淨化強度掃描；
                               # 與 paper 之 pure_steps=10 合組 5/10/15 曲線
  # 成本警告：單張 512x512 在 V100 上約 2 分鐘
  # 需 pixel-space 無條件 guided diffusion checkpoint（約 2GB，見 TWCC_CHECKLIST.md）
