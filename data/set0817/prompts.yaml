# 2026-08-17 建立、2026-08-18 改版的資料集。
#
# prompts[0] 是本輪實際使用的那一句，prompts[1] 是被換掉的那一句，留著備查。
#
# ---- 2026-08-18 改版（使用者裁定）----
#
# 五張名人照（obama／lebron／ronaldo／musk／trump）整組移除，換成三張 CC0 的
# 無名氏肖像，prompt 反過來把他們改成名人。理由見 runs/s0817_prompts 的分析：
# 在 strength 0.8 下「換場景」這一類 prompt 幾乎不服從——LPIPS 對原圖有 0.41
# 到 0.66（改很多），CLIP 對齊增益卻只有 ±0.01（沒有往 prompt 走）。會服從的
# 是「加物件」（cat 戴帽，gain/LPIPS 0.33）與「換主體類別」（shiba 變貓 0.056、
# raccoon 變熊貓 0.106）。無名氏改成名人屬於後者，是換身分而不是換背景。
#
# 換過 prompt 必須重新確認未防禦的編輯有成功（DEC-022）。
#
# ---- 遮罩 ----
#
# 不做遮罩。原本的作法是加頭部遮罩讓臉在 latent 混合中被保留，2026-08-17 整組
# 撤回；`load_dataset` 找不到 headmasks/ 就不做混合，威脅模型是單純的 img2img。

person_a:
  content: "man"
  # 換身分（無名氏 -> 名人）
  prompts:
    - "Barack Obama"
    - "a man standing on a snowy street"

person_b:
  content: "man"
  # 換身分（無名氏 -> 名人）
  prompts:
    - "Morgan Freeman"
    - "a man standing in a busy city street at night"

person_c:
  content: "woman"
  # 換身分（無名氏 -> 名人）
  prompts:
    - "Taylor Swift"
    - "a woman standing in a green forest"

cat:
  content: "cat"
  # 加物件（0.8 下成功，gain/LPIPS 0.33 是全批最高）
  prompts:
    - "a cat wearing a red party hat"
    - "a cat sitting on a snowy roof"

shiba:
  content: "dog"
  # 換類別（2026-08-17 使用者指定：柴犬變貓）
  prompts:
    - "a cat"
    - "a dog wearing a yellow knitted hat"

raccoon:
  content: "raccoon"
  # 換類別（2026-08-17 使用者指定：浣熊變熊貓）
  prompts:
    - "a panda"
    - "a raccoon standing on a city sidewalk at night"

parrot:
  content: "parrot"
  # 換場景（戴帽 0.9 仍失敗；換場景在 0.8 下服從得很弱，gain/LPIPS 0.049）
  prompts:
    - "a parrot perched on a branch in a rainforest"
    - "a parrot wearing a tiny straw hat"
