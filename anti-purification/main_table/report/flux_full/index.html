<style>
:root{
  --paper:#f2f4f7; --surface:#ffffff; --sunk:#e7eaef;
  --ink:#0f151c; --body:#2b3542; --muted:#5d6b7b; --line:#ccd4de;
  --signal:#10559b; --signal-soft:#dce8f6;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1218; --surface:#151d26; --sunk:#0a0f14;
    --ink:#e8eef5; --body:#c2ccd8; --muted:#8695a6; --line:#26313d;
    --signal:#5aa2ef; --signal-soft:#132a41;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1218; --surface:#151d26; --sunk:#0a0f14;
  --ink:#e8eef5; --body:#c2ccd8; --muted:#8695a6; --line:#26313d;
  --signal:#5aa2ef; --signal-soft:#132a41;
}
*{box-sizing:border-box}
body{background:var(--paper); color:var(--body); margin:0; padding:20px 16px 64px;
     font-family:var(--sans); font-size:14px}
.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:3px;
        background:var(--surface); margin-bottom:24px}
table{border-collapse:separate; border-spacing:0; font-family:var(--mono)}
th.mh{position:sticky; top:0; z-index:3; background:var(--sunk); color:var(--ink);
      font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.03em;
      text-align:center; padding:7px 3px; border-bottom:1px solid var(--line)}
th.mh.ours{background:var(--signal-soft); color:var(--signal)}
th.rh{position:sticky; left:0; z-index:2; background:var(--surface);
      border-right:1px solid var(--line); padding:6px 8px; text-align:left;
      vertical-align:top}
th.rh.corner{z-index:4; top:0; background:var(--sunk)}
td{padding:2px; border-bottom:0; text-align:center; width:96px; min-width:96px}
img.cell{width:92px; min-width:92px; height:92px; object-fit:cover; display:block;
         border-radius:2px; background:var(--sunk)}
.id{display:block; font-size:10px; color:var(--muted); padding:2px 0 4px;
    font-variant-numeric:tabular-nums}
.rl{display:flex; gap:6px; align-items:flex-start}
.rl img{width:46px; height:46px; border-radius:2px; display:block; border:1px solid var(--line)}
.rl .t{font-family:var(--sans); font-size:11px; line-height:1.4; color:var(--body);
       max-width:140px; white-space:normal}
.rl .t b{color:var(--ink); font-weight:600; display:block; font-family:var(--mono); font-size:11px}
</style>

<script>
(function(){
  var D = window.D;
  var CONDS = ['undefended','dct_shield_y','mist','dct_shield','photoguard_linf','danp','sifm',
              'dayn','dia_pt','dia_r','photoguard_c','colour_curve_ours','diffvax'];
  var NAMES = ['man_00','man_01','woman_00','woman_01'];

  function f(x){ return (x === '' || x === undefined) ? '—' : Number(x).toFixed(3); }

  var head = '<thead><tr><th class="rh corner"></th>' + CONDS.map(function(c){
    return '<th class="mh' + (c === 'colour_curve_ours' ? ' ours' : '') + '">' + c + '</th>';
  }).join('') + '</tr></thead>';

  var rows = [];
  NAMES.forEach(function(nm){
    for (var pi = 0; pi < 4; pi++) {
      rows.push([nm, String(pi)]);
    }
  });

  var body = '<tbody>' + rows.map(function(r){
    var nm = r[0], pi = r[1];
    var prompt = D.prompts[pi];
    var rh = '<th class="rh"><div class="rl">' +
      '<img src="img/orig_' + nm + '.webp" alt="">' +
      '<span class="t"><b>' + nm + ' p' + pi + '</b>' + prompt + '</span></div></th>';
    var cells = CONDS.map(function(c){
      var key = c + '|' + nm + '|' + pi;
      var idv = D.data[key];
      return '<td><img class="cell" loading="lazy" src="img/' + c + '_' + nm + '_p' + pi +
        '.webp" alt=""><div class="id">' + f(idv) + '</div></td>';
    }).join('');
    return '<tr>' + rh + cells + '</tr>';
  }).join('') + '</tbody>';

  document.getElementById('grid').innerHTML = head + body;
})();
</script>
