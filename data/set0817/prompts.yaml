# 2026-08-17 的新資料集。使用者當日提供九張影像，先前的實驗結果全數作廢。
#
# prompts[0] 是本輪實際使用的那一句，逐張由編輯成功掃描（runs/editsweep）
# 挑出來：SDEdit strength 0.8 / guidance 7.5 下人眼判定有服從 prompt 的那一句。
# 使用者裁定「能成功的就用原本的」，故 cat 與 shiba 維持戴帽，其餘七張改用
# 換場景——換衣物那組的顏色即使開到 0.9 也被忽略，鸚鵡與浣熊戴不上帽子。
# prompts[1] 是被換掉的那一句，留著備查。
#
# 人物另有 headmasks/<影像>.png：strength 0.8 會把臉整個換掉，未防禦的編輯
# 連身分都不剩。遮罩讓頭部在編輯中被保留（latent 混合，非 inpainting）。

cat:
  content: "cat"
  # 戴帽（0.8 下成功）
  prompts:
    - "a cat wearing a red party hat"
    - "a cat sitting on a snowy roof"

shiba:
  content: "dog"
  # 戴帽（0.8 下成功）
  prompts:
    - "a dog wearing a yellow knitted hat"
    - "a dog running on a sandy beach"

parrot:
  content: "parrot"
  # 換場景（戴帽 0.9 仍失敗）
  prompts:
    - "a parrot perched on a branch in a rainforest"
    - "a parrot wearing a tiny straw hat"

raccoon:
  content: "raccoon"
  # 換場景（戴帽 0.9 仍失敗）
  prompts:
    - "a raccoon standing on a city sidewalk at night"
    - "a raccoon wearing a blue baseball cap"

obama:
  content: "man"
  # 換場景（換衣物顏色被忽略）
  prompts:
    - "a man standing on a snowy street"
    - "a man wearing a red hooded sweatshirt"

